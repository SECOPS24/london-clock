<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>London Clock</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 16px;
    }
    #time {
      font-size: clamp(3rem, 12vw, 8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #date {
      font-size: clamp(1rem, 3vw, 1.75rem);
      color: #94a3b8;
      margin-top: 12px;
    }
    #zone {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div id="time">--:--:--</div>
  <div id="date">Loading…</div>
  <div id="zone">London, United Kingdom</div>

  <script>
    var timeEl = document.getElementById('time');
    var dateEl = document.getElementById('date');

    var timeFormat = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/London',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });
    var dateFormat = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/London',
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });

    function tick() {
      var now = new Date();
      timeEl.textContent = timeFormat.format(now);
      dateEl.textContent = dateFormat.format(now);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
